name: Comprobar Preview desplegado de seguridad

on:
  push:
    branches:
      - fix/security-dependencies-2026-09-12
    paths:
      - .github/workflows/preview-security-smoke.yml

permissions:
  contents: read

jobs:
  preview-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Comprobar Preview de Cloudflare en lectura
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://preview.scpp-web.pages.dev'
          echo "Preview: $BASE"
          headers=$(curl -fsSI --connect-timeout 10 --max-time 30 "$BASE/")
          printf '%s\n' "$headers" | sed -n '1,30p'
          code=$(curl -L -sS -o /tmp/home.html -w '%{http_code}' --connect-timeout 10 --max-time 30 "$BASE/")
          echo "/ -> HTTP $code"
          test "$code" = '200'
          grep -qi '<html' /tmp/home.html
          for path in '/portal/' '/portal/ensaios/' '/portal/administracion/ensaios/'; do
            code=$(curl -L -sS -o /tmp/page.html -w '%{http_code}' --connect-timeout 10 --max-time 30 "$BASE$path")
            echo "$path -> HTTP $code"
            test "$code" = '200'
            grep -qi '<html' /tmp/page.html
          done
