name: Actualizar Castelao bilingüe

on:
  push:
    branches: [feature/castelao-fotos-idiomas]
    paths:
      - 'scripts/update_castelao_bilingual.py'
      - '.github/workflows/update-castelao-bilingual.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Actualizar Historia
        run: python scripts/update_castelao_bilingual.py
      - name: Gardar páxinas
        run: |
          if git diff --quiet; then
            echo "Sen cambios"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/historia.astro src/pages/es/historia.astro
          git commit -m "Actualizar Castelao en galego e castelán"
          git push
