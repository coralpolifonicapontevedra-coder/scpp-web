name: Sincronizar novos documentos a R2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-new-documentacion-r2-20260911.yml'

permissions:
  contents: read

concurrency:
  group: scpp-r2-documentacion-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: r2-migration
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install boto3==1.40.1 google-api-python-client==2.177.0 google-auth==2.40.3

      - name: Sincronizar Documentación e Actas con R2
        env:
          MIGRATION_MODE: upload
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          REPORT_PATH: documentacion-r2-migration.csv
        shell: bash
        run: |
          set -o pipefail
          python scripts/migrate-documentation-to-r2.py 2>&1 | tee documentacion-r2-migration.log

      - name: Gardar informe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documentacion-r2-novos-${{ github.run_number }}
          path: |
            documentacion-r2-migration.csv
            documentacion-r2-migration.log
          if-no-files-found: error
          retention-days: 30
