name: Actualizar lockfile nanoid

on:
  push:
    branches:
      - feature/honras-concedidas
    paths:
      - '.github/workflows/fix-nanoid-lock.yml'

permissions:
  contents: write

jobs:
  fix-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: feature/honras-concedidas

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Actualizar só nanoid dentro do rango permitido
        run: npm update nanoid --package-lock-only

      - name: Verificar auditoría
        run: npm audit --audit-level=high

      - name: Gardar lockfile corrixido
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "O lockfile xa estaba actualizado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: actualizar nanoid a versión corrixida"
          git push origin HEAD:feature/honras-concedidas
