name: Reparar miniatura 402e exclusivamente

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/repair-foto-402e-miniatura.py
      - .github/workflows/repair-foto-402e-miniatura.yml

concurrency:
  group: repair-foto-402e-miniatura-only
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    environment: r2-migration
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check boto3 google-api-python-client google-auth pillow
      - name: Reparar só a miniatura 402e
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python scripts/repair-foto-402e-miniatura.py
