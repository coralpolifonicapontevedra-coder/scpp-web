name: Auditar e despregar Persoas en Apps Script Producción

on:
  push:
    branches:
      - deploy/persoas-apps-script-production

permissions:
  contents: read

concurrency:
  group: apps-script-persoas-production
  cancel-in-progress: false

env:
  PRODUCTION_SCRIPT_ID: 1LeJ91m62gdfm8i1XX9EvtxFMvvhhQhMCN_13iUWgvOHaq7q9LUo-nciV
  PRODUCTION_DEPLOYMENT_ID: AKfycbyFrlkJW9Ur1gRVRtIXOucfdr7zFzVGiL_V3KCHbot8IkNvoAXylP7-Dta2X-ki7bEh
  BASELINE_SHA: 3005fd49aced648a9260a2605063b09ca30fa36d

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Configurar credenciais de clasp
        shell: bash
        env:
          CLASP_CREDENTIALS_PRODUCTION: ${{ secrets.CLASP_CREDENTIALS_PRODUCTION }}
          CLASP_CREDENTIALS_PREVIEW: ${{ secrets.CLASP_CREDENTIALS_PREVIEW }}
        run: |
          set -euo pipefail
          CREDS="${CLASP_CREDENTIALS_PRODUCTION:-}"
          if [ -z "$CREDS" ]; then
            CREDS="${CLASP_CREDENTIALS_PREVIEW:-}"
          fi
          if [ -z "$CREDS" ]; then
            echo 'BLOQUEADO: non hai credenciais clasp dispoñibles.'
            exit 1
          fi
          printf '%s' "$CREDS" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: Obter Apps Script vivo de Producción
        shell: bash
        run: |
          set -euo pipefail
          rm -rf live-production
          mkdir live-production
          printf '{"scriptId":"%s","rootDir":"."}\n' "$PRODUCTION_SCRIPT_ID" > live-production/.clasp.json
          cd live-production
          npx --yes @google/clasp@3 pull
          npx --yes @google/clasp@3 status

      - name: Verificar que o proxecto é o de Producción
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_ID="$(node -e "console.log(require('./live-production/.clasp.json').scriptId || '')")"
          if [ "$ACTUAL_ID" != "$PRODUCTION_SCRIPT_ID" ]; then
            echo "BLOQUEADO: scriptId inesperado: $ACTUAL_ID"
            exit 1
          fi

      - name: Auditar ficheiros que xa existían en Producción
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit/baseline
          for f in repertorio-dispatcher-integracion.js xestion-permisos-dispatcher-integracion.js; do
            git show "$BASELINE_SHA:apps-script-production/$f" > "audit/baseline/$f"
            if cmp -s "live-production/$f" "audit/baseline/$f"; then
              echo "$f: coincide coa base previa á promoción" | tee -a audit/resumo.txt
            elif cmp -s "live-production/$f" "apps-script-production/$f"; then
              echo "$f: xa coincide co obxectivo actual" | tee -a audit/resumo.txt
            else
              echo "BLOQUEADO: $f cambiou no Apps Script vivo e non coincide nin coa base nin co obxectivo." | tee -a audit/resumo.txt
              diff -u "audit/baseline/$f" "live-production/$f" > "audit/diff-live-$f.txt" || true
              exit 1
            fi
          done

      - name: Auditar ficheiros novos de Persoas V2
        shell: bash
        run: |
          set -euo pipefail
          for f in persoas-administracion-v2.js persoas-legacy-compat-v2.js; do
            if [ ! -f "live-production/$f" ]; then
              echo "$f: novo, aínda non está no Apps Script vivo" | tee -a audit/resumo.txt
            elif cmp -s "live-production/$f" "apps-script-production/$f"; then
              echo "$f: xa coincide co obxectivo actual" | tee -a audit/resumo.txt
            else
              echo "BLOQUEADO: existe un $f distinto no Apps Script vivo." | tee -a audit/resumo.txt
              diff -u "live-production/$f" "apps-script-production/$f" > "audit/diff-live-$f.txt" || true
              exit 1
            fi
          done

      - name: Comprobar a implementación existente
        shell: bash
        run: |
          set -euo pipefail
          cd live-production
          npx --yes @google/clasp@3 deployments | tee ../audit/deployments-before.txt
          if ! grep -Fq "$PRODUCTION_DEPLOYMENT_ID" ../audit/deployments-before.txt; then
            echo 'BLOQUEADO: non se localizou o Deployment ID actual de Producción.'
            exit 1
          fi

      - name: Gardar auditoría
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: persoas-apps-script-production-audit
          path: audit/
          if-no-files-found: warn
          retention-days: 7

  deploy:
    needs: audit
    if: contains(github.event.head_commit.message, '[DEPLOY-PERSOAS-PROD]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Configurar credenciais de clasp
        shell: bash
        env:
          CLASP_CREDENTIALS_PRODUCTION: ${{ secrets.CLASP_CREDENTIALS_PRODUCTION }}
          CLASP_CREDENTIALS_PREVIEW: ${{ secrets.CLASP_CREDENTIALS_PREVIEW }}
        run: |
          set -euo pipefail
          CREDS="${CLASP_CREDENTIALS_PRODUCTION:-}"
          if [ -z "$CREDS" ]; then
            CREDS="${CLASP_CREDENTIALS_PREVIEW:-}"
          fi
          if [ -z "$CREDS" ]; then
            echo 'BLOQUEADO: non hai credenciais clasp dispoñibles.'
            exit 1
          fi
          printf '%s' "$CREDS" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: Partir de novo do Apps Script vivo
        shell: bash
        run: |
          set -euo pipefail
          rm -rf live-production live-before
          mkdir live-production
          printf '{"scriptId":"%s","rootDir":"."}\n' "$PRODUCTION_SCRIPT_ID" > live-production/.clasp.json
          cd live-production
          npx --yes @google/clasp@3 pull
          cd ..
          cp -a live-production live-before

      - name: Aplicar só os catro ficheiros de Persoas
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            persoas-administracion-v2.js \
            persoas-legacy-compat-v2.js \
            repertorio-dispatcher-integracion.js \
            xestion-permisos-dispatcher-integracion.js
          do
            cp "apps-script-production/$f" "live-production/$f"
          done

      - name: Blindar o diff efectivo
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t CHANGED < <(diff -qr live-before live-production | sed -E 's#.* (live-before|live-production)/([^ ]+).*#\2#' | sort -u)
          printf '%s\n' "${CHANGED[@]}" | tee effective-diff.txt
          ALLOWED='persoas-administracion-v2.js persoas-legacy-compat-v2.js repertorio-dispatcher-integracion.js xestion-permisos-dispatcher-integracion.js'
          for f in "${CHANGED[@]}"; do
            [ -z "$f" ] && continue
            case " $ALLOWED " in
              *" $f "*) ;;
              *) echo "BLOQUEADO: cambio inesperado no push: $f"; exit 1 ;;
            esac
          done

      - name: Comprobar a implementación antes de modificar
        shell: bash
        run: |
          set -euo pipefail
          cd live-production
          npx --yes @google/clasp@3 deployments | tee ../deployments-before.txt
          grep -Fq "$PRODUCTION_DEPLOYMENT_ID" ../deployments-before.txt

      - name: Subir o proxecto vivo co parche mínimo
        working-directory: live-production
        shell: bash
        run: |
          set -euo pipefail
          npx --yes @google/clasp@3 push --force

      - name: Crear versión e MODIFICAR a implementación existente
        shell: bash
        run: |
          set -euo pipefail
          cd live-production
          OUT="$(npx --yes @google/clasp@3 version 'Administración Persoas V2 · Producción')"
          echo "$OUT"
          VERSION="$(printf '%s\n' "$OUT" | sed -nE 's/.*[Vv]ersion[^0-9]*([0-9]+).*/\1/p' | tail -1)"
          if [ -z "$VERSION" ]; then
            echo 'Non foi posible determinar o número de versión creado.'
            exit 1
          fi
          npx --yes @google/clasp@3 deploy -i "$PRODUCTION_DEPLOYMENT_ID" -V "$VERSION" -d "Administración Persoas V2 · Producción"
          npx --yes @google/clasp@3 deployments | tee ../deployments-after.txt
          grep -Fq "$PRODUCTION_DEPLOYMENT_ID" ../deployments-after.txt
          echo "Deployment actualizado mantendo o mesmo ID: $PRODUCTION_DEPLOYMENT_ID"

      - name: Proba de lectura do endpoint Persoas V2
        shell: bash
        env:
          WEB_WRITE_TOKEN: ${{ secrets.WEB_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${WEB_WRITE_TOKEN:-}" ]; then
            echo 'WEB_WRITE_TOKEN non está dispoñible en GitHub; omítese a proba HTTP automática.'
            exit 0
          fi
          URL="https://script.google.com/macros/s/${PRODUCTION_DEPLOYMENT_ID}/exec"
          curl -fsSL -X POST "$URL" \
            -H 'content-type: application/json' \
            --data "$(jq -nc --arg token "$WEB_WRITE_TOKEN" '{token:$token,accion:"persoasV2SyncListar"}')" \
            | tee smoke-response.json
          jq -e '.ok == true' smoke-response.json >/dev/null

      - name: Gardar resultado do despregue
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: persoas-apps-script-production-deploy
          path: |
            effective-diff.txt
            deployments-before.txt
            deployments-after.txt
            smoke-response.json
          if-no-files-found: warn
          retention-days: 7
