name: Fix arquivo return button once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-arquivo-return-button-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch arquivo movement state compatibility
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('src/pages/portal/administracion/arquivo.astro')
          s=p.read_text(encoding='utf-8')
          old="const movementElements=(id:string)=>data.elementosMovemento.filter(x=>clean(x.Id_Movemento)===id),isPhysicalMovement=(row:Row)=>physicalTypes.has(clean(row.TipoMovemento)),movementClosed=(row:Row)=>['Devolto','Pechado','Cancelado'].includes(clean(row.Estado));"
          new="const movementElements=(id:string)=>data.elementosMovemento.filter(x=>clean(x.Id_Movemento)===id),isPhysicalMovement=(row:Row)=>physicalTypes.has(clean(row.TipoMovemento)),movementClosed=(row:Row)=>['Devolto','Cancelado'].includes(clean(row.Estado))||(clean(row.Estado)==='Pechado'&&(!isPhysicalMovement(row)||!!clean(row.DataDevolucion)));"
          if s.count(old)!=1:
              raise SystemExit('Expected movementClosed snippet not found exactly once')
          s=s.replace(old,new)
          old2='<strong class="badge">${esc(r.Estado)}</strong>${canReturn?`<button class="primary" data-return="${esc(id)}">Rexistrar devolución</button>`:\'\'}'
          new2='<strong class="badge">${esc(canReturn?\'Pendente de devolución\':r.Estado)}</strong>${canReturn?`<button class="primary" data-return="${esc(id)}">Rexistrar devolución</button>`:\'\'}'
          if s.count(old2)!=1:
              raise SystemExit('Expected badge/button snippet not found exactly once')
          s=s.replace(old2,new2)
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
          git diff -- src/pages/portal/administracion/arquivo.astro
      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/portal/administracion/arquivo.astro
          git commit -m 'Show return action for physical arquivo movements'
          git pull --rebase origin main
          git push origin HEAD:main
