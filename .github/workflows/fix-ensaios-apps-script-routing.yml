name: Corrixir transporte de Ensaios

on:
  push:
    branches: [feature/castelao-historia-fotos-final]
    paths:
      - 'scripts/fix-ensaios-apps-script-routing.py'
      - '.github/workflows/fix-ensaios-apps-script-routing.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Corrixir enrutamento de Ensaios
        run: python scripts/fix-ensaios-apps-script-routing.py

      - name: Gardar cambio na rama
        run: |
          if git diff --quiet -- functions/_lib/apps-script.js; then
            echo "Sen cambios pendentes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/_lib/apps-script.js
          git commit -m "Fixar Ensaios ao Apps Script da rama"
          git push origin HEAD:feature/castelao-historia-fotos-final
