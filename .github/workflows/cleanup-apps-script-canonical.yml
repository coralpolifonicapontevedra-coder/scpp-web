name: Limpeza segura Apps Script canónico

on:
  push:
    branches:
      - feature/admin-concertos
    paths:
      - .github/workflows/cleanup-apps-script-canonical.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/admin-concertos
          fetch-depth: 0

      - name: Aplicar limpeza con gardas exactas
        run: python scripts/cleanup-apps-script-canonical.py

      - name: Validar sintaxe individual e global
        shell: bash
        run: |
          set -euo pipefail
          for f in apps-script/*.gs; do
            cp "$f" /tmp/check.js
            node --check /tmp/check.js >/dev/null
          done
          : > /tmp/apps-script-combined.js
          for f in apps-script/*.gs; do
            printf '\n/* FILE: %s */\n' "$f" >> /tmp/apps-script-combined.js
            cat "$f" >> /tmp/apps-script-combined.js
          done
          node --check /tmp/apps-script-combined.js
          git diff --check -- apps-script docs/archive/apps-script

      - name: Auditar duplicados
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audit-apps-script-canonical.mjs > /tmp/audit.json
          cat /tmp/audit.json
          node - <<'NODE'
          const a=require('/tmp/audit.json');
          if(a.duplicates.length) {
            console.error('Seguen existindo duplicados:', a.duplicates.map(x=>x.name).join(', '));
            process.exit(2);
          }
          if(a.doPostCount!==1 || a.doGetCount!==1 || a.syntaxErrors.length) process.exit(3);
          NODE

      - name: Gardar limpeza
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A apps-script docs/archive/apps-script
          git commit -m "apps-script: eliminar duplicados e separar histórico"
          git push origin HEAD:feature/admin-concertos
