name: Auditar Historia de Castelao en produción

on:
  push:
    branches: [audit/live-historia-castelao]
    paths:
      - '.github/workflows/audit-live-historia-castelao.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar Historia galega publicada
        shell: bash
        run: |
          set -euo pipefail
          base=https://coralpolifonicapontevedra.org
          curl -L --fail --silent --show-error "$base/historia/" -o /tmp/gl.html
          for marker in \
            'castelao-san-david-block' \
            'castelao-roseton-block' \
            'O logotipo da Polifónica, deseñado por Castelao'; do
            if grep -q "$marker" /tmp/gl.html; then echo "OK $marker"; else echo "FALTA $marker"; exit 1; fi
          done
          if grep -q '45.7%' /tmp/gl.html; then echo 'OK recorte circular 45.7%'; else echo 'FALTA recorte circular'; exit 1; fi
          if grep -E 'Fotografía publicada desde R2|Publicados desde R2' /tmp/gl.html; then echo 'QUEDA TEXTO R2'; exit 1; else echo 'OK sen texto R2'; fi
          python - <<'PY'
          from pathlib import Path
          s=Path('/tmp/gl.html').read_text()
          video=s.index('As escenografías da Polifónica explicadas no Museo')
          quote=s.index('Con Castelao, a Polifónica non só cantaba')
          print('posición cita', quote, 'posición vídeo', video)
          assert video > quote
          print('GL OK: vídeo ao final')
          PY

      - name: Comprobar Historia castelá publicada
        shell: bash
        run: |
          set -euo pipefail
          base=https://coralpolifonicapontevedra.org
          curl -L --fail --silent --show-error "$base/es/historia/" -o /tmp/es.html
          for marker in \
            'castelao-san-david-block' \
            'castelao-roseton-block' \
            'El logotipo de la Polifónica, diseñado por Castelao'; do
            if grep -q "$marker" /tmp/es.html; then echo "OK $marker"; else echo "FALTA $marker"; exit 1; fi
          done
          if grep -q '45.7%' /tmp/es.html; then echo 'OK recorte circular 45.7%'; else echo 'FALTA recorte circular'; exit 1; fi
          if grep -E 'conservada en R2|Panos castelao · R2|Publicados desde R2' /tmp/es.html; then echo 'QUEDA TEXTO R2'; exit 1; else echo 'OK sen texto R2'; fi
          python - <<'PY'
          from pathlib import Path
          s=Path('/tmp/es.html').read_text()
          video=s.index('Las escenografías de la Polifónica explicadas en el Museo')
          conservation=s.index('Un legado que sigue identificando a la Polifónica')
          print('posición conservación', conservation, 'posición vídeo', video)
          assert video > conservation
          print('ES OK: vídeo ao final')
          PY

      - name: Comprobar imaxes servidas
        shell: bash
        run: |
          set -euo pipefail
          base=https://coralpolifonicapontevedra.org
          declare -A imgs=(
            [san-david]='/api/galeria-orixinal?ruta=fotos%2Forixinais%2Fc5875c20-7c55-536e-8419-32ad2404c70b.jpg'
            [logo]='/api/galeria-orixinal?ruta=fotos%2Forixinais%2F373c7089-3234-430a-b035-7eb3b86beb80.jpg'
            [roseton]='/api/galeria-orixinal?ruta=fotos%2Forixinais%2F91630e1a-725d-42c9-9aa5-259e6655ef08.jpg'
          )
          for key in san-david logo roseton; do
            curl -L --fail --silent --show-error "$base${imgs[$key]}" -o "/tmp/$key.bin"
            file "/tmp/$key.bin"
            wc -c "/tmp/$key.bin"
          done
