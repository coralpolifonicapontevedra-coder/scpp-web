name: Comparar imaxes da actualizacion de seguridade

on:
  push:
    branches:
      - fix/security-dependencies-2026-09-12
    paths:
      - .github/workflows/regenerate-security-lock.yml

permissions:
  contents: read

jobs:
  compare-images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - name: Descargar version de respaldo
        uses: actions/checkout@v4
        with:
          ref: backup/pre-actualizacion-seguridad-2026-09-12
          path: baseline

      - name: Descargar version candidata
        uses: actions/checkout@v4
        with:
          ref: fix/security-dependencies-2026-09-12
          path: candidate

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.16.0"

      - name: Construir version de respaldo
        working-directory: baseline
        run: |
          npm ci
          npm run build

      - name: Construir version candidata
        working-directory: candidate
        run: |
          npm ci
          npm run build

      - name: Comparar imaxes e SVG xerados
        run: |
          cd "$GITHUB_WORKSPACE/baseline"
          find dist -type f \( -iname '*.svg' -o -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' -o -iname '*.avif' -o -iname '*.gif' \) -print0 | sort -z | xargs -0 -r sha256sum | sed 's#  dist/#  #' > "$GITHUB_WORKSPACE/baseline-images.sha256"
          cd "$GITHUB_WORKSPACE/candidate"
          find dist -type f \( -iname '*.svg' -o -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' -o -iname '*.avif' -o -iname '*.gif' \) -print0 | sort -z | xargs -0 -r sha256sum | sed 's#  dist/#  #' > "$GITHUB_WORKSPACE/candidate-images.sha256"
          echo "Imaxes respaldo: $(wc -l < "$GITHUB_WORKSPACE/baseline-images.sha256")"
          echo "Imaxes candidata: $(wc -l < "$GITHUB_WORKSPACE/candidate-images.sha256")"
          if diff -u "$GITHUB_WORKSPACE/baseline-images.sha256" "$GITHUB_WORKSPACE/candidate-images.sha256" > "$GITHUB_WORKSPACE/image-diff.txt"; then
            echo "RESULTADO: todas as imaxes e SVG xerados son identicos byte a byte."
          else
            echo "RESULTADO: hai diferenzas nas imaxes ou SVG xerados:"
            cat "$GITHUB_WORKSPACE/image-diff.txt"
            exit 1
          fi
