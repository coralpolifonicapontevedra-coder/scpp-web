name: Validar actualizacion de seguridad

on:
  push:
    branches:
      - fix/security-dependencies-2026-09-12
    paths:
      - .github/workflows/regenerate-security-lock.yml

permissions:
  contents: write

jobs:
  validate-security-update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: fix/security-dependencies-2026-09-12

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.16.0"
          cache: npm

      - name: Regenerar package-lock de forma controlada
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Instalar exactamente el lockfile regenerado
        run: npm ci

      - name: Mostrar versiones relevantes
        run: npm ls sharp svgo vitest miniflare wrangler @cloudflare/vite-plugin

      - name: Auditar vulnerabilidades altas
        run: npm audit --audit-level=high

      - name: Comprobar TypeScript
        run: npm run check

      - name: Executar ESLint
        run: npm run lint

      - name: Executar probas
        run: npm run test

      - name: Construír a web
        run: npm run build

      - name: Gardar package-lock validado
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json xa estaba sincronizado"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): guardar lockfile de seguridad validado"
          git push origin HEAD:fix/security-dependencies-2026-09-12
