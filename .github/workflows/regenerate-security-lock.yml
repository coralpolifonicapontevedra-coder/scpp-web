name: Validar actualizacion de seguridad

on:
  push:
    branches:
      - fix/security-dependencies-2026-09-12
    paths:
      - .github/workflows/regenerate-security-lock.yml

permissions:
  contents: read

jobs:
  validate-security-update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: fix/security-dependencies-2026-09-12

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.16.0"
          cache: npm

      - name: Instalar exactamente el lockfile
        run: npm ci

      - name: Mostrar versiones relevantes
        run: npm ls sharp svgo vitest miniflare || true

      - name: Auditar vulnerabilidades altas
        run: npm audit --audit-level=high

      - name: Comprobar TypeScript
        run: npm run check

      - name: Executar ESLint
        run: npm run lint

      - name: Executar probas
        run: npm run test

      - name: Construír a web
        run: npm run build
