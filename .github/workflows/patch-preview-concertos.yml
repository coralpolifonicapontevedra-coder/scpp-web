name: Patch Apps Script Preview - Concertos admin

on:
  push:
    branches:
      - agent/apps-script-sync-architecture
    paths:
      - .github/workflows/patch-preview-concertos.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/apps-script-sync-architecture
          fetch-depth: 0

      - name: Fetch concertos branch
        run: git fetch origin agent/administracion-concertos:refs/remotes/origin/agent/administracion-concertos

      - name: Copy concertos administration script
        run: |
          git show origin/agent/administracion-concertos:apps-script/concertos-administracion.gs > "apps-script/snapshot-2026-08-19/preview/concertos-administracion.js"

      - name: Patch Preview dispatcher
        shell: python
        run: |
          from pathlib import Path

          path = Path('apps-script/snapshot-2026-08-19/preview/Código.js')
          text = path.read_text(encoding='utf-8')

          marker = "    if (accion === 'listarEnsaiosPortal') {"
          if marker not in text:
              raise SystemExit('Non se atopou o punto seguro antes de listarEnsaiosPortal')

          block = r'''    if (accion === 'listarConcertosAdministracionPortal') {
      try {
        const resultado = listarConcertosAdministracionPortal_(datos);
        return respostaJSON(resultado);
      } catch (erroConcertosLista) {
        return respostaJSON({
          ok: false,
          codigo: 'ADMIN_CONCERTOS_LIST_EXCEPTION',
          erro: String(
            erroConcertosLista && erroConcertosLista.message
              ? erroConcertosLista.message
              : erroConcertosLista
          )
        });
      }
    }

    if (accion === 'actualizarConcertoAdministracionPortal') {
      try {
        bloqueo.waitLock(10000);
        const resultado = actualizarConcertoAdministracionPortal_(datos);
        return respostaJSON(resultado);
      } catch (erroConcertoActualizacion) {
        return respostaJSON({
          ok: false,
          codigo: 'ADMIN_CONCERTOS_UPDATE_EXCEPTION',
          erro: String(
            erroConcertoActualizacion && erroConcertoActualizacion.message
              ? erroConcertoActualizacion.message
              : erroConcertoActualizacion
          )
        });
      }
    }

    if (accion === 'crearConcertoAdministracionPortal') {
      try {
        bloqueo.waitLock(10000);
        const resultado = crearConcertoAdministracionPortal_(datos);
        return respostaJSON(resultado);
      } catch (erroConcertoAlta) {
        return respostaJSON({
          ok: false,
          codigo: 'ADMIN_CONCERTOS_CREATE_EXCEPTION',
          erro: String(
            erroConcertoAlta && erroConcertoAlta.message
              ? erroConcertoAlta.message
              : erroConcertoAlta
          )
        });
      }
    }

    if (accion === 'eliminarConcertoAdministracionPortal') {
      try {
        bloqueo.waitLock(10000);
        const resultado = eliminarConcertoAdministracionPortal_(datos);
        return respostaJSON(resultado);
      } catch (erroConcertoBaixa) {
        return respostaJSON({
          ok: false,
          codigo: 'ADMIN_CONCERTOS_DELETE_EXCEPTION',
          erro: String(
            erroConcertoBaixa && erroConcertoBaixa.message
              ? erroConcertoBaixa.message
              : erroConcertoBaixa
          )
        });
      }
    }

'''

          if "accion === 'listarConcertosAdministracionPortal'" not in text:
              text = text.replace(marker, block + marker, 1)

          required = [
              "accion === 'listarConcertosAdministracionPortal'",
              "accion === 'actualizarConcertoAdministracionPortal'",
              "accion === 'crearConcertoAdministracionPortal'",
              "accion === 'eliminarConcertoAdministracionPortal'",
          ]
          missing = [x for x in required if x not in text]
          if missing:
              raise SystemExit('Faltan accións tras o parche: ' + ', '.join(missing))

          path.write_text(text, encoding='utf-8')

      - name: Commit patched snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "apps-script/snapshot-2026-08-19/preview/Código.js" "apps-script/snapshot-2026-08-19/preview/concertos-administracion.js"
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat(preview): integrar administración de concertos en Apps Script"
            git push origin HEAD:agent/apps-script-sync-architecture
          fi
