name: Deploy arquivo production once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-arquivo-production-once.yml'

permissions:
  contents: read

concurrency:
  group: apps-script-production-arquivo
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PRODUCTION_SCRIPT_ID: '1LeJ91m62gdfm8i1XX9EvtxFMvvhhQhMCN_13iUWgvOHaq7q9LUo-nciV'
      PRODUCTION_DEPLOYMENT_ID: 'AKfycbyFrlkJW9Ur1gRVRtIXOucfdr7zFzVGiL_V3KCHbot8IkNvoAXylP7-Dta2X-ki7bEh'
      CLASP_CREDENTIALS_PRODUCTION: ${{ secrets.CLASP_CREDENTIALS_PRODUCTION }}
      CLASP_CREDENTIALS_PREVIEW: ${{ secrets.CLASP_CREDENTIALS_PREVIEW }}

    steps:
      - name: Checkout main exacto
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar credenciais de clasp
        shell: bash
        run: |
          set -euo pipefail
          CREDS="${CLASP_CREDENTIALS_PRODUCTION:-}"
          SOURCE='production'
          if [ -z "$CREDS" ]; then
            CREDS="${CLASP_CREDENTIALS_PREVIEW:-}"
            SOURCE='preview-credential-as-oauth-fallback'
          fi
          if [ -z "$CREDS" ]; then
            echo 'Faltan credenciais de clasp. Non se modificou Apps Script.'
            exit 1
          fi
          printf '%s' "$CREDS" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          echo "Credencial dispoñible: $SOURCE"

      - name: Identificar deployment vivo de Producción
        id: live
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/scpp-live /tmp/scpp-before
          printf '{"scriptId":"%s","rootDir":"."}\n' "$PRODUCTION_SCRIPT_ID" > /tmp/scpp-live/.clasp.json
          cd /tmp/scpp-live
          npx --yes @google/clasp@3 list-deployments | tee /tmp/deployments-before.txt
          LINE="$(grep -F "$PRODUCTION_DEPLOYMENT_ID" /tmp/deployments-before.txt | head -n 1 || true)"
          if [ -z "$LINE" ]; then
            echo 'Non se atopou o deployment de Producción esperado. Abortado.'
            exit 1
          fi
          OLD_VERSION="$(printf '%s\n' "$LINE" | sed -n 's/.*@\([0-9][0-9]*\).*/\1/p')"
          if [ -z "$OLD_VERSION" ]; then
            echo "Non foi posible obter a versión despregada desde: $LINE"
            exit 1
          fi
          echo "old_version=$OLD_VERSION" >> "$GITHUB_OUTPUT"

      - name: Ler versión realmente despregada
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/scpp-live
          npx --yes @google/clasp@3 pull --versionNumber "${{ steps.live.outputs.old_version }}" --deleteUnusedFiles --force
          cp -a /tmp/scpp-live/. /tmp/scpp-before/

      - name: Comprobar dispatcher e aplicar só Arquivo
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/scpp-live
          for ACTION in \
            listarArquivoAdministracion \
            gardarFondoAdministracion \
            gardarElementoFondoAdministracion \
            gardarMovementoArquivoAdministracion \
            gardarElementoMovementoAdministracion \
            rexistrarDevolucionArquivoAdministracion; do
            if ! grep -R -F -q --include='*.js' --include='*.gs' "accion === '$ACTION'" .; then
              echo "Falta no deployment vivo o dispatcher para $ACTION. Abortado sen modificar Producción."
              exit 3
            fi
          done

          cp "$GITHUB_WORKSPACE/apps-script-production/arquivo-administracion.js" /tmp/scpp-live/arquivo-administracion.js

          python - <<'PY'
          from pathlib import Path
          before = Path('/tmp/scpp-before')
          after = Path('/tmp/scpp-live')
          def snap(root):
              out = {}
              for p in root.rglob('*'):
                  if p.is_file() and p.name != '.clasp.json':
                      out[p.relative_to(root).as_posix()] = p.read_bytes()
              return out
          a, b = snap(before), snap(after)
          changed = sorted(k for k in set(a) | set(b) if a.get(k) != b.get(k))
          print('Diff efectivo:', changed)
          if changed not in (['arquivo-administracion.js'], []):
              raise SystemExit('O diff non é exclusivamente arquivo-administracion.js. Abortado.')
          if not changed:
              print('Arquivo xa coincide coa fonte de produción; crearase igualmente unha nova versión para asegurar o deployment.')
          PY

          npx --yes @google/clasp@3 show-file-status

      - name: Push seguro e nova versión
        id: version
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/scpp-live
          npx --yes @google/clasp@3 push --force
          OUT="$(npx --yes @google/clasp@3 create-version 'Arquivo: gardado de movementos e xustificantes')"
          echo "$OUT"
          NEW_VERSION="$(printf '%s\n' "$OUT" | grep -oE '[0-9]+' | tail -n 1)"
          if [ -z "$NEW_VERSION" ]; then
            echo 'Non foi posible obter a nova versión. O deployment segue apuntando á versión anterior.'
            exit 1
          fi
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Actualizar só o deployment de Producción
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/scpp-live
          OLD_VERSION='${{ steps.live.outputs.old_version }}'
          NEW_VERSION='${{ steps.version.outputs.new_version }}'
          npx --yes @google/clasp@3 create-deployment \
            --deploymentId "$PRODUCTION_DEPLOYMENT_ID" \
            --versionNumber "$NEW_VERSION" \
            --description 'Arquivo · gardado de movementos e xustificantes'
          npx --yes @google/clasp@3 list-deployments | tee /tmp/deployments-after.txt
          LINE="$(grep -F "$PRODUCTION_DEPLOYMENT_ID" /tmp/deployments-after.txt | head -n 1 || true)"
          if ! printf '%s\n' "$LINE" | grep -Eq "@${NEW_VERSION}([^0-9]|$)"; then
            echo 'A verificación do deployment fallou. Tentando rollback inmediato.'
            npx --yes @google/clasp@3 create-deployment \
              --deploymentId "$PRODUCTION_DEPLOYMENT_ID" \
              --versionNumber "$OLD_VERSION" \
              --description 'Rollback automático Arquivo' || true
            exit 1
          fi
          echo "Producción actualizada: $OLD_VERSION -> $NEW_VERSION"
