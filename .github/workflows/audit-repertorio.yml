name: Auditar repertorio

on:
  workflow_dispatch:
  schedule:
    - cron: "30 4 * * 1"

permissions:
  contents: read

concurrency:
  group: scpp-repertorio-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: r2-migration

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            boto3==1.40.1 \
            google-api-python-client==2.177.0 \
            google-auth==2.40.3

      - name: Mostrar conta técnica de Google
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python - <<'PY'
          import json, os
          data = json.loads(os.environ['GOOGLE_SERVICE_ACCOUNT_JSON'])
          email = data.get('client_email', '')
          print('Conta técnica que precisa acceso de lectura á Sheet Repertorio:')
          print(email or 'Non se puido obter client_email do segredo.')
          PY

      - name: Ejecutar auditoría
        id: audit
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AUDIT_REPORT_CSV: repertorio-audit.csv
          AUDIT_REPORT_MD: repertorio-audit.md
        shell: bash
        run: |
          set +e
          : > repertorio-audit.log
          status=2
          for intento in 1 2 3; do
            echo "===== INTENTO ${intento}/3 =====" | tee -a repertorio-audit.log
            python scripts/audit-repertorio.py 2>&1 | tee -a repertorio-audit.log
            status=${PIPESTATUS[0]}

            if [[ "$status" -eq 0 ]]; then
              break
            fi

            # Código 1 = incidencias reais detectadas pola auditoría: non reintentar.
            if [[ "$status" -eq 1 ]]; then
              break
            fi

            # Código 2 = a auditoría non puido completarse (por exemplo 429/5xx de Google).
            if [[ "$status" -eq 2 && "$intento" -lt 3 ]]; then
              espera=$((intento * 15))
              echo "Fallo temporal de execución; novo intento en ${espera}s..." | tee -a repertorio-audit.log
              sleep "$espera"
              continue
            fi

            break
          done
          exit "$status"

      - name: Mostrar incidencias no log e no resumo
        if: always()
        shell: bash
        run: |
          echo
          echo "===== RESUMO DA AUDITORÍA ====="
          if [[ -f repertorio-audit.md ]]; then
            cat repertorio-audit.md
            cat repertorio-audit.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "A auditoría non xerou informe."
            echo "## A auditoría non xerou informe" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo
          echo "===== INCIDENCIAS DETALLADAS ====="
          if [[ -f repertorio-audit.csv ]]; then
            cat repertorio-audit.csv
          else
            echo "Non se xerou o CSV de incidencias."
          fi

      - name: Gardar informes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repertorio-audit-${{ github.run_number }}
          path: |
            repertorio-audit.csv
            repertorio-audit.md
            repertorio-audit.log
          if-no-files-found: warn
          retention-days: 90

      - name: Marcar erros críticos
        if: steps.audit.outcome == 'failure'
        run: |
          echo "A auditoría detectou erros críticos. As incidencias completas aparecen no paso anterior."
          exit 1
