name: Order permisos people by surnames production once

on:
  push:
    branches:
      - ops/order-permisos-surnames-production-20260904
    paths:
      - '.github/workflows/order-permisos-surnames-production-once.yml'

permissions:
  contents: write

concurrency:
  group: permisos-ui-production
  cancel-in-progress: false

jobs:
  patch-production-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main de Producción
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Comprobar regra de Producción
        shell: bash
        run: |
          set -euo pipefail
          test -f AGENTS.md
          grep -q 'REGRA CRÍTICA E OBRIGATORIA PARA PRODUCIÓN' AGENTS.md

      - name: Aplicar só a ordenación visual por apelidos
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/pages/portal/administracion/permisos.astro')
          text = path.read_text(encoding='utf-8')

          marker = "  const nome = (u) => u?.nome || u?.persoa || u?.email || '—';\n  const permisosUsuario = (email) => data.permisos.filter((p) => p.email === email && p.activo !== false);"
          if text.count(marker) != 1:
              raise SystemExit('BLOQUEADO: non se atopou exactamente unha vez o punto seguro para a ordenación.')

          replacement = """  const nome = (u) => u?.nome || u?.persoa || u?.email || '—';
  const claveOrdenApelidos = (u) => {
    const primeiro = String(u?.primeiroApelido || '').trim();
    const segundo = String(u?.segundoApelido || '').trim();
    const completo = String(nome(u) || '').trim();

    if (primeiro || segundo) {
      return `${primeiro} ${segundo} ${completo}`.trim();
    }

    const partes = completo.split(/\\s+/).filter(Boolean);
    if (partes.length <= 1) return completo;

    const cantidadeApelidos = partes.length >= 3 ? 2 : 1;
    const apelidos = partes.slice(-cantidadeApelidos).join(' ');
    const nomesPropios = partes.slice(0, -cantidadeApelidos).join(' ');
    return `${apelidos} ${nomesPropios}`.trim();
  };
  const compararPorApelidos = (a, b) =>
    claveOrdenApelidos(a).localeCompare(claveOrdenApelidos(b), 'gl', { sensitivity:'base' }) ||
    nome(a).localeCompare(nome(b), 'gl', { sensitivity:'base' });
  const permisosUsuario = (email) => data.permisos.filter((p) => p.email === email && p.activo !== false);"""
          text = text.replace(marker, replacement, 1)

          old_filter = """    const usuarios = data.usuarios.filter((u) => {
      const coincideTexto = !query || (`${nome(u)} ${u.email}`).toLowerCase().includes(query);
      const coincideModulo = !modulo || permisosConcedidosUsuario(u.email).some((p) => p.modulo === modulo);
      return coincideTexto && coincideModulo;
    });"""
          new_filter = """    const usuarios = data.usuarios.filter((u) => {
      const coincideTexto = !query || (`${nome(u)} ${u.email}`).toLowerCase().includes(query);
      const coincideModulo = !modulo || permisosConcedidosUsuario(u.email).some((p) => p.modulo === modulo);
      return coincideTexto && coincideModulo;
    }).sort(compararPorApelidos);"""
          if text.count(old_filter) != 1:
              raise SystemExit('BLOQUEADO: non se atopou exactamente unha vez a lista visual de persoas.')
          text = text.replace(old_filter, new_filter, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verificar que só cambia a páxina de permisos
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          printf 'Ficheiros modificados:\n%s\n' "${changed[*]}"
          if [ "${#changed[@]}" -ne 1 ] || [ "${changed[0]}" != 'src/pages/portal/administracion/permisos.astro' ]; then
            echo 'BLOQUEADO: apareceu un cambio fóra da páxina de permisos.'
            exit 1
          fi
          if git diff --name-only | grep -E '^(apps-script|functions)/'; then
            echo 'BLOQUEADO: detectouse un cambio de backend ou Apps Script.'
            exit 1
          fi
          git diff --check

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar build
        run: npm run build

      - name: Integrar só o cambio validado en main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/portal/administracion/permisos.astro
          git commit -m 'ui: ordenar persoas por apelidos en permisos'
          git push origin HEAD:main

      - name: Confirmación final
        shell: bash
        run: |
          echo 'Producción: modificada só a páxina permisos.astro.'
          echo 'Apps Script e backend: intactos.'
