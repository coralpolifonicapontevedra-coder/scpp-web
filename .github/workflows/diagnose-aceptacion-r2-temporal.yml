name: Parche temporal aceptacións

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/diagnose-aceptacion-r2-temporal.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Aplicar parche mínimo
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('functions/api/persoas-revision.js')
          s = p.read_text(encoding='utf-8')
          old = "    if (!result?.aceptacion?.rowId) throw new Error('O backend non confirmou o rexistro na táboa Aceptación.');\n"
          if s.count(old) != 1:
              raise SystemExit('Non se atopou exactamente unha validación antiga do Row ID.')
          s = s.replace(old, '', 1)
          marker = "  const latest = {\n"
          insert = "  const aceptacionRowId = String(result?.aceptacion?.rowId || '').trim();\n  if (!aceptacionRowId) {\n    console.warn('Apps Script confirmou a actualización sen devolver o Row ID da aceptación; consérvase o PDF por compatibilidade.');\n  }\n\n"
          if s.count(marker) != 1:
              raise SystemExit('Non se atopou o punto de inserción do índice da aceptación.')
          s = s.replace(marker, insert + marker, 1)
          old_row = '    aceptacionRowId: result.aceptacion.rowId,\n'
          if s.count(old_row) != 1:
              raise SystemExit('Non se atopou o Row ID no índice.')
          s = s.replace(old_row, '    aceptacionRowId,\n', 1)
          old_return = '    aceptacionId: result.aceptacion.rowId\n'
          if s.count(old_return) != 1:
              raise SystemExit('Non se atopou o Row ID na resposta final.')
          s = s.replace(old_return, '    aceptacionId: aceptacionRowId || null\n', 1)
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check

      - name: Publicar rama de corrección
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b fix/aceptacion-pdf-legacy
          git add functions/api/persoas-revision.js
          git commit -m 'Evitar borrar aceptacións válidas por resposta legacy'
          git push --force-with-lease origin HEAD:refs/heads/fix/aceptacion-pdf-legacy
