name: Diagnóstico temporal aceptación R2

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/diagnose-aceptacion-r2-temporal.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: r2-migration
    steps:
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar boto3
        run: python -m pip install boto3==1.40.1

      - name: Comprobar aceptación 50 en R2 privado
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          python - <<'PY'
          import os, boto3, json
          bucket='scpp-privado'
          prefix='persoas/aceptacions/50/'
          exact='persoas/aceptacions/50/aceptacion-8bc81563-0062-4110-98b4-0c3efbeb0f9b.pdf'
          s3=boto3.client(
              's3',
              endpoint_url=f"https://{os.environ['R2_ACCOUNT_ID']}.r2.cloudflarestorage.com",
              aws_access_key_id=os.environ['R2_ACCESS_KEY_ID'],
              aws_secret_access_key=os.environ['R2_SECRET_ACCESS_KEY'],
              region_name='auto'
          )
          out=s3.list_objects_v2(Bucket=bucket, Prefix=prefix, MaxKeys=1000)
          items=[{'key':x['Key'],'size':x['Size'],'last_modified':x['LastModified'].isoformat()} for x in out.get('Contents',[])]
          print('PREFIX_COUNT', len(items))
          for item in items:
              print('OBJECT', json.dumps(item, ensure_ascii=False))
          try:
              h=s3.head_object(Bucket=bucket, Key=exact)
              print('EXACT_PDF', 'YES', h.get('ContentLength'), h.get('ContentType'))
          except Exception as e:
              print('EXACT_PDF', 'NO', type(e).__name__, str(e))
          try:
              obj=s3.get_object(Bucket=bucket, Key=prefix+'latest.json')
              print('LATEST_JSON', obj['Body'].read().decode('utf-8'))
          except Exception as e:
              print('LATEST_JSON', 'NO', type(e).__name__, str(e))
          PY
