name: Repertorio dynamic style once v2

on:
  push:
    branches:
      - preview
    paths:
      - '.github/workflows/repertorio-dynamic-style-once-v2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0
      - name: Aplicar parche
        run: python scripts/repertorio-dynamic-style-patch.py
      - name: Gardar en preview
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/components/AdministracionNav.astro; then
            echo 'Sen cambios.'
            exit 0
          fi
          git config user.name 'coralpolifonicapontevedra-coder'
          git config user.email 'coralpolifonicapontevedra@gmail.com'
          git add src/components/AdministracionNav.astro
          git commit -m 'Preview: igualar edición e detalle ao deseño de alta'
          git pull --rebase origin preview
          git push origin HEAD:preview
