name: Sincronizar galería con R2

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

concurrency:
  group: sync-galeria-r2
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install --disable-pip-version-check boto3 requests

      - name: Xerar e publicar índice
        env:
          SCPP_SITE_URL: https://scpp-web.pages.dev
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_BUCKET: ${{ secrets.R2_PUBLIC_BUCKET }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          SYNC_ATTEMPTS: '5'
          SYNC_TIMEOUT_SECONDS: '90'
        run: python scripts/sync-galeria-r2.py
