name: Sincronizar galería con R2

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sync-galeria-r2.yml'
      - 'scripts/sync-galeria-r2.py'

concurrency:
  group: sync-galeria-r2
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: r2-migration
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Comprobar configuración
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_BUCKET: scpp-publico
        shell: bash
        run: |
          set -euo pipefail
          test -n "$R2_ACCOUNT_ID" || { echo 'Falta R2_ACCOUNT_ID'; exit 1; }
          test -n "$R2_ACCESS_KEY_ID" || { echo 'Falta R2_ACCESS_KEY_ID'; exit 1; }
          test -n "$R2_SECRET_ACCESS_KEY" || { echo 'Falta R2_SECRET_ACCESS_KEY'; exit 1; }
          test "$R2_PUBLIC_BUCKET" = 'scpp-publico' || { echo 'Bucket público incorrecto'; exit 1; }
          echo "Configuración R2 presente. Destino: $R2_PUBLIC_BUCKET"

      - name: Instalar dependencias
        run: python -m pip install --disable-pip-version-check boto3 requests pillow

      - name: Verificar fotos, generar miniaturas y publicar índice
        env:
          SCPP_SITE_URL: https://scpp-web.pages.dev
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_BUCKET: scpp-publico
          SYNC_ATTEMPTS: '5'
          SYNC_TIMEOUT_SECONDS: '90'
          THUMB_MAX_WIDTH: '720'
          THUMB_MAX_HEIGHT: '540'
          THUMB_QUALITY: '78'
        run: python scripts/sync-galeria-r2.py
