name: Preparar fotografías pendentes en R2

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches:
      - main
    paths:
      - scripts/cache-pending-photos-r2.py
      - .github/workflows/cache-pending-photos-r2.yml

permissions:
  contents: read

concurrency:
  group: scpp-cache-pending-photos-r2
  cancel-in-progress: false

jobs:
  cache:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: r2-migration

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            boto3==1.40.1 \
            google-api-python-client==2.177.0 \
            google-auth==2.40.3 \
            Pillow==11.3.0

      - name: Preparar índice, orixinais e miniaturas
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python scripts/cache-pending-photos-r2.py

      - name: Resumo
        if: always()
        run: |
          echo "## Revisión fotográfica" >> "$GITHUB_STEP_SUMMARY"
          echo "Índice: scpp-privado/indices/revision-fotos-v1.json" >> "$GITHUB_STEP_SUMMARY"
          echo "Miniaturas: scpp-privado/fotos/traballo-miniaturas/" >> "$GITHUB_STEP_SUMMARY"
