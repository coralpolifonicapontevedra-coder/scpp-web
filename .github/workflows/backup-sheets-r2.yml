name: Backup diario de Sheets a R2

on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/backup-sheets-to-r2.py"
      - ".github/workflows/backup-sheets-r2.yml"

permissions:
  contents: read

concurrency:
  group: scpp-sheets-backup-r2
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: r2-migration

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            boto3==1.40.1 \
            google-api-python-client==2.177.0 \
            google-auth==2.40.3

      - name: Comprobar configuración sin mostrar secretos
        shell: bash
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          for name in GOOGLE_SERVICE_ACCOUNT_JSON R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET; do
            if [[ -z "${!name:-}" ]]; then
              echo "Falta el secreto $name"
              exit 1
            fi
          done
          echo "Configuración disponible."

      - name: Crear copia espejo de Sheets
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          BACKUP_PREFIX: backups/sheets/current/
          BACKUP_EXCLUDED_PREFIXES: "SCPP PREVIEW -,TEST -,BACKUP -,SCPP_BACKUP"
        shell: bash
        run: |
          set -o pipefail
          python scripts/backup-sheets-to-r2.py 2>&1 | tee backup-sheets-r2.log

      - name: Guardar diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backup-sheets-r2-${{ github.run_number }}
          path: backup-sheets-r2.log
          if-no-files-found: warn
          retention-days: 14
