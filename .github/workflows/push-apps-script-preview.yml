name: Push Apps Script Preview

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Escribe PREVIEW para confirmar que quieres actualizar únicamente Apps Script Preview'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: apps-script-preview
  cancel-in-progress: false

jobs:
  push-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PREVIEW_SCRIPT_ID: '1icbtEkhRPg0r4wcypJZ4UxQb1NVaky7UKvkrpSQxfx44hAS6rZzq5aeF'
      PREVIEW_DEPLOYMENT_ID: 'AKfycbyUsvfiFEUpEgbLhov02EeXIgW6d-wjpTFQcZXOEMHEpXpQzbYnqSH_5L0N8wTwSGU'
      PRODUCTION_SCRIPT_ID: '1LeJ91m62gdfm8i1XX9EvtxFMvvhhQhMCN_13iUWgvOHaq7q9LUo-nciV'
      PRODUCTION_DEPLOYMENT_ID: 'AKfycbyFrlkJW9Ur1gRVRtIXOucfdr7zFzVGiL_V3KCHbot8IkNvoAXylP7-Dta2X-ki7bEh'
    steps:
      - name: Validar confirmación
        shell: bash
        run: |
          if [ "${{ inputs.confirm }}" != "PREVIEW" ]; then
            echo "Confirmación incorrecta. Debes escribir PREVIEW."
            exit 1
          fi

      - name: Checkout exacto de la rama preview
        uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 1

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Blindar destino de Apps Script
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_ID="$(node -e "console.log(require('./apps-script-preview/.clasp.json').scriptId || '')")"
          if [ "$ACTUAL_ID" = "$PRODUCTION_SCRIPT_ID" ]; then
            echo 'BLOQUEADO: apps-script-preview apunta al proyecto de PRODUCCIÓN.'
            exit 1
          fi
          if [ "$ACTUAL_ID" != "$PREVIEW_SCRIPT_ID" ]; then
            echo "BLOQUEADO: scriptId inesperado en apps-script-preview: $ACTUAL_ID"
            exit 1
          fi
          echo 'Destino verificado: proyecto Apps Script Preview.'

      - name: Configurar credenciales de clasp
        shell: bash
        env:
          CLASP_CREDENTIALS_PREVIEW: ${{ secrets.CLASP_CREDENTIALS_PREVIEW }}
        run: |
          set -euo pipefail
          if [ -z "${CLASP_CREDENTIALS_PREVIEW:-}" ]; then
            echo 'Falta el secret CLASP_CREDENTIALS_PREVIEW.'
            exit 1
          fi
          printf '%s' "$CLASP_CREDENTIALS_PREVIEW" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: Comprobar proyecto antes del despliegue
        working-directory: apps-script-preview
        shell: bash
        run: |
          npx --yes @google/clasp@3 status

      - name: Identificar versión viva de Preview
        id: live
        working-directory: apps-script-preview
        shell: bash
        run: |
          set -euo pipefail
          npx --yes @google/clasp@3 list-deployments | tee /tmp/preview-deployments-before.txt
          LINE="$(grep -F "$PREVIEW_DEPLOYMENT_ID" /tmp/preview-deployments-before.txt | head -n 1 || true)"
          [ -n "$LINE" ] || { echo 'No se encontró el deployment web de Preview esperado.'; exit 1; }
          OLD_VERSION="$(printf '%s\n' "$LINE" | sed -n 's/.*@\([0-9][0-9]*\).*/\1/p')"
          [ -n "$OLD_VERSION" ] || { echo 'No se pudo identificar la versión viva de Preview.'; exit 1; }
          echo "old_version=$OLD_VERSION" >> "$GITHUB_OUTPUT"
          echo "Preview vive actualmente en la versión $OLD_VERSION"

      - name: Subir código a HEAD de Apps Script Preview
        working-directory: apps-script-preview
        shell: bash
        run: |
          set -euo pipefail
          npx --yes @google/clasp@3 push --force

      - name: Crear versión de Preview
        id: version
        working-directory: apps-script-preview
        shell: bash
        run: |
          set -euo pipefail
          OUT="$(npx --yes @google/clasp@3 create-version "Preview desde GitHub ${GITHUB_SHA}")"
          echo "$OUT"
          NEW_VERSION="$(printf '%s\n' "$OUT" | grep -oE '[0-9]+' | tail -n 1)"
          [ -n "$NEW_VERSION" ] || { echo 'No se pudo obtener la nueva versión.'; exit 1; }
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Actualizar deployment web de Preview
        working-directory: apps-script-preview
        shell: bash
        run: |
          set -euo pipefail
          OLD_VERSION='${{ steps.live.outputs.old_version }}'
          NEW_VERSION='${{ steps.version.outputs.new_version }}'
          OUT="$(npx --yes @google/clasp@3 create-deployment --deploymentId "$PREVIEW_DEPLOYMENT_ID" --versionNumber "$NEW_VERSION" --description "Preview ${GITHUB_SHA}")"
          echo "$OUT"
          printf '%s\n' "$OUT" | grep -F "$PREVIEW_DEPLOYMENT_ID" >/dev/null || { echo 'La orden no confirmó el deployment de Preview esperado.'; exit 1; }
          OK=0
          for intento in 1 2 3 4 5; do
            sleep $((intento * 2))
            npx --yes @google/clasp@3 list-deployments | tee "/tmp/preview-deployments-after-${intento}.txt"
            LINE="$(grep -F "$PREVIEW_DEPLOYMENT_ID" "/tmp/preview-deployments-after-${intento}.txt" | head -n 1 || true)"
            if printf '%s\n' "$LINE" | grep -Eq "@${NEW_VERSION}([^0-9]|$)"; then
              OK=1
              break
            fi
          done
          if [ "$OK" -ne 1 ]; then
            echo 'No se confirmó la nueva versión; rollback automático de Preview.'
            npx --yes @google/clasp@3 create-deployment --deploymentId "$PREVIEW_DEPLOYMENT_ID" --versionNumber "$OLD_VERSION" --description 'Rollback automático Preview' || true
            exit 1
          fi
          echo "Preview actualizado: $OLD_VERSION -> $NEW_VERSION"

      - name: Confirmación final
        shell: bash
        run: |
          echo 'Apps Script Preview y su deployment web /exec han quedado actualizados.'
          echo 'Producción no se ha modificado.'
