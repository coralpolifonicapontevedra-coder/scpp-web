name: Auditoría Apps Script canónico

on:
  push:
    branches:
      - feature/admin-concertos
    paths:
      - scripts/audit-apps-script-canonical.mjs
      - scripts/normalize-apps-script-environment.py
      - .github/workflows/audit-apps-script-canonical.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/admin-concertos
          fetch-depth: 0
      - name: Normalizar configuración do ambiente
        id: normalize
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python scripts/normalize-apps-script-environment.py > docs/framework-scpp/apps-script-normalize.log 2>&1
          EXIT=$?
          cat docs/framework-scpp/apps-script-normalize.log
          exit $EXIT
      - name: Desfacer cambios parciais se a normalización fallou
        if: steps.normalize.outcome != 'success'
        run: git restore apps-script
      - name: Validar sintaxe Apps Script
        if: steps.normalize.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          for f in apps-script/*.gs; do
            cp "$f" /tmp/check.js
            node --check /tmp/check.js >/dev/null
          done
          git diff --check -- apps-script
      - name: Auditar apps-script
        if: always()
        shell: bash
        run: |
          set +e
          node scripts/audit-apps-script-canonical.mjs > docs/framework-scpp/apps-script-canonical-audit.json
          EXIT=$?
          cat docs/framework-scpp/apps-script-canonical-audit.json
          exit 0
      - name: Gardar resultado seguro
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/framework-scpp/apps-script-normalize.log docs/framework-scpp/apps-script-canonical-audit.json
          if [ "${{ steps.normalize.outcome }}" = "success" ]; then git add apps-script; fi
          if git diff --cached --quiet; then
            echo "Sen cambios"
            exit 0
          fi
          git commit -m "chore(apps-script): gardar resultado da normalizacion"
          git push origin HEAD:feature/admin-concertos
