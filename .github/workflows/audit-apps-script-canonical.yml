name: Auditoría Apps Script canónico

on:
  push:
    branches:
      - feature/admin-concertos
    paths:
      - 'apps-script/**'
      - scripts/audit-apps-script-canonical.mjs
      - .github/workflows/audit-apps-script-canonical.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/admin-concertos
          fetch-depth: 0

      - name: Validar cada ficheiro Apps Script
        shell: bash
        run: |
          set -euo pipefail
          for f in apps-script/*.gs; do
            cp "$f" /tmp/check.js
            node --check /tmp/check.js >/dev/null
          done

      - name: Validar o proxecto como espazo global único
        id: combined
        continue-on-error: true
        shell: bash
        run: |
          set +e
          : > /tmp/apps-script-combined.js
          for f in apps-script/*.gs; do
            case "$f" in
              *Código.producion-reference.gs) continue ;;
            esac
            printf '\n/* FILE: %s */\n' "$f" >> /tmp/apps-script-combined.js
            cat "$f" >> /tmp/apps-script-combined.js
          done
          node --check /tmp/apps-script-combined.js > docs/framework-scpp/apps-script-combined-syntax.log 2>&1
          EXIT=$?
          if [ "$EXIT" -eq 0 ]; then echo 'OK: sintaxe combinada válida.' > docs/framework-scpp/apps-script-combined-syntax.log; fi
          cat docs/framework-scpp/apps-script-combined-syntax.log
          exit "$EXIT"

      - name: Auditar estrutura, duplicados e IDs incrustados
        if: always()
        shell: bash
        run: |
          set +e
          node scripts/audit-apps-script-canonical.mjs > docs/framework-scpp/apps-script-canonical-audit.json
          cat docs/framework-scpp/apps-script-canonical-audit.json
          exit 0

      - name: Gardar só os informes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/framework-scpp/apps-script-canonical-audit.json docs/framework-scpp/apps-script-combined-syntax.log
          if git diff --cached --quiet; then
            echo "Informes sen cambios"
            exit 0
          fi
          git commit -m "chore(apps-script): actualizar auditoria canonica"
          git push origin HEAD:feature/admin-concertos

# auditoría relanzada tras a limpeza de duplicados e separación do histórico
