name: Importar fotografías de Presidencias

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/import-presidencias-fotos-r2.py
      - scripts/patch-presidencias-fotos.py
      - .github/workflows/import-presidencias-fotos-r2.yml

concurrency:
  group: import-presidencias-fotos-r2
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    environment: r2-migration
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check boto3 google-api-python-client google-auth pillow
      - name: Importar a R2 e rexistrar en Fotos sen galería
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python scripts/import-presidencias-fotos-r2.py
      - name: Substituír exactamente as tres fotos en Historia · Presidencias
        run: |
          python scripts/patch-presidencias-fotos.py
          if git diff --quiet -- src/components/PublicCoralMenu.astro; then
            echo "A páxina xa usa as tres fotografías novas"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/PublicCoralMenu.astro
          git commit -m "Substitúe tres fotos na sección Presidencias"
          git push
