name: Migrar Drive a R2

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "plan revisa sin subir; upload ejecuta la migración"
        required: true
        default: plan
        type: choice
        options:
          - plan
          - upload
      confirmation:
        description: "Para upload escribe exactamente MIGRAR; en plan déjalo vacío"
        required: false
        default: ""
        type: string

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: scpp-r2-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: r2-migration

    steps:
      - name: Validar confirmación
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.mode }}" == "upload" && "${{ inputs.confirmation }}" != "MIGRAR" ]]; then
            echo "Para ejecutar una subida real debes escribir MIGRAR exactamente."
            exit 1
          fi

      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias de migración
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            boto3==1.40.1 \
            google-api-python-client==2.177.0 \
            google-auth==2.40.3

      - name: Comprobar secretos sin mostrarlos
        shell: bash
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          for name in GOOGLE_SERVICE_ACCOUNT_JSON R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET; do
            if [[ -z "${!name:-}" ]]; then
              echo "Falta el secreto $name"
              exit 1
            fi
          done
          echo "Los cinco secretos necesarios están configurados."

      - name: Ejecutar migración conservadora
        shell: bash
        env:
          MIGRATION_MODE: ${{ inputs.mode }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          REPORT_PATH: r2-migration-report.csv
        run: |
          set +e
          set -o pipefail
          printf 'category,record_id,source_name,r2_key,status,size,sha256,detail\n' > r2-migration-report.csv
          python scripts/migrate-drive-to-r2.py 2>&1 | tee r2-migration.log
          status=${PIPESTATUS[0]}
          echo
          echo "===== ERRORES DETECTADOS ====="
          grep ',ERROR_' r2-migration-report.csv || echo "Sin errores en el informe."
          exit "$status"

      - name: Construir índice completo del repertorio
        shell: bash
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          python scripts/build-r2-index-239.py | tee r2-index.log

      - name: Crear o actualizar el pull request del índice
        id: repertorio_pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          commit-message: Actualizar índice completo de repertorio R2
          branch: automation/actualizar-indice-r2
          base: main
          delete-branch: true
          title: "Actualizar índice completo de repertorio R2"
          body: |
            Actualización automática generada por la migración conservadora de Drive a R2.

            El cambio queda pendiente de la comprobación `quality` y de revisión antes de incorporarse a `main`.
          add-paths: |
            functions/_data/repertorio-r2.js

      - name: Ejecutar controles de calidad del pull request
        if: >-
          steps.repertorio_pr.outputs.pull-request-operation == 'created' ||
          steps.repertorio_pr.outputs.pull-request-operation == 'updated'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BRANCH: automation/actualizar-indice-r2
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if gh workflow run quality.yml --ref "$PR_BRANCH"; then
              echo "Comprobación quality iniciada para $PR_BRANCH."
              exit 0
            fi
            echo "El workflow todavía no está disponible; reintento $attempt/5."
            sleep $((attempt * 5))
          done
          echo "No se pudo iniciar la comprobación quality."
          exit 1

      - name: Guardar informe y diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-migration-report-${{ inputs.mode }}-${{ github.run_number }}
          path: |
            r2-migration-report.csv
            r2-migration.log
            r2-index.log
          if-no-files-found: warn
          retention-days: 30

