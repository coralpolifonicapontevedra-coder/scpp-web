name: Migrar Drive a R2

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "plan revisa sin subir; upload ejecuta la migración"
        required: true
        default: plan
        type: choice
        options:
          - plan
          - upload
      confirmation:
        description: "Para upload escribe exactamente MIGRAR; en plan déjalo vacío"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: scpp-r2-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: r2-migration

    steps:
      - name: Validar confirmación
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.mode }}" == "upload" && "${{ inputs.confirmation }}" != "MIGRAR" ]]; then
            echo "Para ejecutar una subida real debes escribir MIGRAR exactamente."
            exit 1
          fi

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias de migración
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            boto3==1.40.1 \
            google-api-python-client==2.177.0 \
            google-auth==2.40.3

      - name: Comprobar secretos sin mostrarlos
        shell: bash
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          for name in GOOGLE_SERVICE_ACCOUNT_JSON R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET; do
            if [[ -z "${!name:-}" ]]; then
              echo "Falta el secreto $name"
              exit 1
            fi
          done
          echo "Los cinco secretos necesarios están configurados."

      - name: Ejecutar migración conservadora
        env:
          MIGRATION_MODE: ${{ inputs.mode }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          REPORT_PATH: r2-migration-report.csv
        run: python scripts/migrate-drive-to-r2.py

      - name: Guardar informe de revisión
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-migration-report-${{ inputs.mode }}-${{ github.run_number }}
          path: r2-migration-report.csv
          if-no-files-found: warn
          retention-days: 30
