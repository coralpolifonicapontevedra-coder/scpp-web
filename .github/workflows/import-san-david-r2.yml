name: Importar pano San David a Fotos e R2

on:
  push:
    branches: [feature/castelao-panos-r2]
    paths:
      - scripts/import-san-david-r2.py
      - .github/workflows/import-san-david-r2.yml
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest
    environment: r2-migration
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check boto3 google-api-python-client google-auth pillow
      - name: Importar San David
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python scripts/import-san-david-r2.py
