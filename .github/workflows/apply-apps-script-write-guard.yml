name: Aplicar guard de escritura de Apps Script

on:
  push:
    branches:
      - agent/versionar-apps-script
    paths:
      - '.github/workflows/apply-apps-script-write-guard.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: agent/versionar-apps-script
          fetch-depth: 0

      - name: Aplicar guard de rexistro
        shell: python
        run: |
          from pathlib import Path

          path = Path('apps-script/src/Código.js')
          source = path.read_text(encoding='utf-8')
          old = """function rexistrarAcceso(datos) {
            try {
              datos = datos || {};
          """.replace('          ', '')
          new = """function rexistrarAcceso(datos) {
            try {
              const permiteEscritura = String(
                PropertiesService.getScriptProperties().getProperty(
                  'SCPP_ALLOW_WRITES'
                ) || ''
              ).toLowerCase() === 'true';

              if (!permiteEscritura) {
                console.log(
                  'Rexistro de acceso omitido: SCPP_ALLOW_WRITES=false'
                );
                return;
              }

              datos = datos || {};
          """.replace('          ', '')

          if source.count(old) != 1:
              raise SystemExit(f'Esperábase unha única coincidencia; atopáronse {source.count(old)}')

          path.write_text(source.replace(old, new, 1), encoding='utf-8')

          audit = Path('scripts/audit-apps-script-config.mjs')
          audit_source = audit.read_text(encoding='utf-8')
          marker = "if (!files.includes('configuracion-entorno.js')) {"
          check = """if (!codeFile.includes('Rexistro de acceso omitido: SCPP_ALLOW_WRITES=false')) {
            errors.push('Código.js does not disable access-log writes when writes are disabled');
          }

          """.replace('          ', '')
          if check not in audit_source:
              if audit_source.count(marker) != 1:
                  raise SystemExit('Non se atopou o punto de inserción da auditoría')
              audit.write_text(audit_source.replace(marker, check + marker, 1), encoding='utf-8')

      - name: Comprobar Apps Script
        run: npm run check:apps-script

      - name: Gardar corrección na rama do PR
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps-script/src/Código.js scripts/audit-apps-script-config.mjs
          git diff --cached --exit-code && { echo 'Non hai cambios que gardar'; exit 1; } || true
          git commit -m 'Bloquear rexistro de accesos cando as escrituras están desactivadas'
          git push origin HEAD:agent/versionar-apps-script
