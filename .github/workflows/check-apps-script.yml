name: Comprobar Apps Script

on:
  pull_request:
    paths:
      - 'apps-script/**'
      - 'scripts/check-apps-script.mjs'
      - '.github/workflows/check-apps-script.yml'
      - 'package.json'
  push:
    branches:
      - main
    paths:
      - 'apps-script/**'
      - 'scripts/check-apps-script.mjs'
      - '.github/workflows/check-apps-script.yml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Comprobar Apps Script
        run: node scripts/check-apps-script.mjs
