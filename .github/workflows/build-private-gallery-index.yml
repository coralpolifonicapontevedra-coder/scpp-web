name: Construír índice da galería privada

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches:
      - main
    paths:
      - "scripts/build-private-gallery-index.py"
      - ".github/workflows/build-private-gallery-index.yml"

permissions:
  contents: read

concurrency:
  group: scpp-private-gallery-index
  cancel-in-progress: false

jobs:
  build-index:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: r2-migration

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install boto3==1.40.1 google-api-python-client==2.177.0 google-auth==2.40.3 Pillow==11.3.0

      - name: Crear índice e miniaturas privadas
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python scripts/build-private-gallery-index.py

      - name: Resumen
        if: always()
        run: |
          echo "## Índice da galería privada" >> "$GITHUB_STEP_SUMMARY"
          echo "Destino: scpp-privado/indices/galeria-privada.json" >> "$GITHUB_STEP_SUMMARY"
