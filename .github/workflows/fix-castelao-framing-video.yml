name: Corrixir encadre e vídeo de Castelao

on:
  push:
    branches:
      - fix/castelao-encadre-video-final
    paths:
      - scripts/fix-castelao-framing-video.py
      - .github/workflows/fix-castelao-framing-video.yml

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/castelao-encadre-video-final
          fetch-depth: 0
      - name: Aplicar cambios
        run: python scripts/fix-castelao-framing-video.py
      - name: Comprobar resultado
        run: |
          grep -q 'castelao-san-david-block' src/pages/historia.astro
          grep -q 'castelao-roseton-block' src/pages/historia.astro
          grep -q 'clip-path: circle(45.7%' src/pages/historia.astro
          grep -q 'castelao-san-david-block' src/pages/es/historia.astro
          grep -q 'castelao-roseton-block' src/pages/es/historia.astro
          ! grep -E 'pano-caption[^>]*>[^<]*R2|pano-photo-credit[^>]*>[^<]*R2|castelao-emblem-source[^>]*>[^<]*R2' src/pages/historia.astro src/pages/es/historia.astro
      - name: Gardar cambios
        run: |
          if git diff --quiet; then
            echo 'Sen cambios pendentes'
            exit 0
          fi
          git config user.name 'coralpolifonicapontevedra-coder'
          git config user.email 'coralpolifonicapontevedra@gmail.com'
          git add src/pages/historia.astro src/pages/es/historia.astro
          git commit -m 'Afinar imaxes e colocar o vídeo ao final'
          git push origin HEAD:fix/castelao-encadre-video-final
