name: Axustar tipografia de Actualidade

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/axustar-tipografia-actualidade.yml'

permissions:
  contents: write

jobs:
  axustar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar o repositorio
        uses: actions/checkout@v4

      - name: Equilibrar a escala tipografica
        shell: python
        run: |
          from pathlib import Path

          ruta = Path('src/pages/actualidade.astro')
          contido = ruta.read_text(encoding='utf-8')

          cambios = [
              ("font-size: 0.76rem;\n    font-weight: 700;\n    letter-spacing: 0.2em;", "font-size: 0.82rem;\n    font-weight: 700;\n    letter-spacing: 0.18em;"),
              ("font-size: clamp(3rem, 7vw, 5.75rem);", "font-size: clamp(2.5rem, 5.5vw, 4.6rem);"),
              ("font-size: clamp(2.25rem, 5.7vw, 5.1rem);", "font-size: clamp(1.9rem, 4.5vw, 4rem);"),
              ("font-size: 0.83rem;\n    gap: 0.5rem 1.5rem;", "font-size: 0.88rem;\n    gap: 0.5rem 1.5rem;"),
              ("font-size: 0.82rem;\n    font-weight: 700;\n    gap: 0.65rem;", "font-size: 0.86rem;\n    font-weight: 700;\n    gap: 0.65rem;"),
              (".titulo-seccion h2 {\n    color: var(--wine);\n    font-size: 0.78rem;", ".titulo-seccion h2 {\n    color: var(--wine);\n    font-size: 0.88rem;"),
              (":global(.publicacion-meta),\n  :global(.publicacion-pe) {\n    align-items: center;\n    color: var(--muted);\n    display: flex;\n    font-size: 0.75rem;", ":global(.publicacion-meta),\n  :global(.publicacion-pe) {\n    align-items: center;\n    color: var(--muted);\n    display: flex;\n    font-size: 0.82rem;"),
          ]

          for antigo, novo in cambios:
              if contido.count(antigo) != 1:
                  raise SystemExit(f'Non se atopou exactamente unha vez: {antigo!r}')
              contido = contido.replace(antigo, novo)

          ruta.write_text(contido, encoding='utf-8')

      - name: Retirar a tarefa temporal e gardar o cambio
        run: |
          rm .github/workflows/axustar-tipografia-actualidade.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/actualidade.astro .github/workflows/axustar-tipografia-actualidade.yml
          git commit -m "Equilibra a tipografia de Actualidade"
          git push
