name: Refrescar obras de Concertos una vez

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/refresh-concertos-obras-fast-once.yml'

permissions:
  contents: read

concurrency:
  group: scpp-refresh-concertos-obras-fast-once
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: r2-migration
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: |
          python -m pip install boto3==1.40.1 google-api-python-client==2.177.0 google-auth==2.40.3
      - name: Refrescar obras de Concertos en R2
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python scripts/refresh-concertos-obras-fast.py
