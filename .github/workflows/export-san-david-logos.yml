name: Exportar logos de San David a R2

on:
  push:
    branches: [feature/castelao-fotos-idiomas]
    paths:
      - 'scripts/export_san_david_logos.py'
      - '.github/workflows/export-san-david-logos.yml'
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    environment: r2-migration
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check boto3 google-api-python-client google-auth pillow
      - name: Exportar logos de San David
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python scripts/export_san_david_logos.py
