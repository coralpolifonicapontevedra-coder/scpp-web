name: Fase 1 - Migrar fichas de Persoas a R2

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "plan revisa; upload sobe, verifica e actualiza Persoas"
        required: true
        default: plan
        type: choice
        options:
          - plan
          - upload
      confirmation:
        description: "Para upload escribe exactamente MIGRAR_FICHAS"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: scpp-r2-fichas-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: r2-migration

    steps:
      - name: Validar confirmación
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.mode }}" == "upload" && "${{ inputs.confirmation }}" != "MIGRAR_FICHAS" ]]; then
            echo "Para executar a subida real escribe MIGRAR_FICHAS exactamente."
            exit 1
          fi

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            boto3==1.40.1 \
            google-api-python-client==2.177.0 \
            google-auth==2.40.3

      - name: Executar migración e verificación
        shell: bash
        env:
          MIGRATION_MODE: ${{ inputs.mode }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          REPORT_PATH: r2-fichas-migration-report.csv
        run: |
          set +e
          set -o pipefail
          python scripts/migrate-person-fichas-to-r2.py 2>&1 | tee r2-fichas-migration.log
          status=${PIPESTATUS[0]}
          echo
          echo "===== ERROS OU CONFLITOS ====="
          grep 'ERROR_\|CONFLITO' r2-fichas-migration-report.csv || echo "Sen erros nin conflitos."
          exit "$status"

      - name: Gardar informe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-fichas-${{ inputs.mode }}-${{ github.run_number }}
          path: |
            r2-fichas-migration-report.csv
            r2-fichas-migration.log
          if-no-files-found: warn
          retention-days: 30
