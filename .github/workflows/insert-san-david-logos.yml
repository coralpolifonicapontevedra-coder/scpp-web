name: Integrar logos de San David

on:
  push:
    branches: [feature/castelao-fotos-idiomas]
    paths:
      - 'scripts/insert_san_david_logos.py'
      - '.github/workflows/insert-san-david-logos.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/insert_san_david_logos.py
      - name: Gardar páxinas
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/historia.astro src/pages/es/historia.astro
          git commit -m "Integrar logos históricos de San David"
          git push
