name: Aplicar mellora Castelao e a escena

on:
  push:
    branches: [feature/castelao-escena]
    paths:
      - 'scripts/apply_castelao_scene.py'
      - 'scripts/castelao-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar a sección patrimonial
        run: python scripts/apply_castelao_scene.py
      - name: Gardar cambios
        run: |
          if git diff --quiet; then
            echo "Sen cambios"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/historia.astro
          git commit -m "Mellorar Castelao e a escena"
          git push
